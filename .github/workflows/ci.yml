name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Lint
        run: yarn lint

      - name: Test
        run: yarn test

      - name: Install Melodash dependencies
        working-directory: melodash
        run: yarn install --immutable

      - name: Melodash typecheck
        working-directory: melodash
        run: yarn run lint

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build production image
        run: docker compose build proxy

      - name: Build Melodash image
        run: docker compose build melodash

      - name: Build test image
        run: docker compose --profile test build test

      - name: Docker Compose smoke test
        run: bash scripts/docker-compose-smoke.sh
