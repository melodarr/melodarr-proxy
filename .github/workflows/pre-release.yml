name: Pre-release (develop)

on:
  push:
    branches:
      - develop

jobs:
  prerelease:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Ensure we fetch all history for rev-list

      - name: Get latest tag
        id: get_tag
        run: |
          git fetch --tags
          TAG=$(git tag --sort=-v:refname | head -n 1)
          echo "latest_tag=$TAG" >> $GITHUB_OUTPUT

      - name: Compute next dev version
        id: version
        run: |
          BASE=${{ steps.get_tag.outputs.latest_tag }}
          BASE=${BASE#v}

          # fallback if no tag exists
          if [ -z "$BASE" ]; then
            BASE="0.5.0"
          fi

          COUNT=$(git rev-list --count origin/develop || git rev-list --count HEAD)
          VERSION="${BASE}-dev.${COUNT}"

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

      - name: Create tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ steps.version.outputs.tag }}
          git push origin ${{ steps.version.outputs.tag }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push proxy image
        run: |
          docker build -t ghcr.io/melodarr/melodarr-proxy:${{ steps.version.outputs.tag }} .
          docker tag ghcr.io/melodarr/melodarr-proxy:${{ steps.version.outputs.tag }} ghcr.io/melodarr/melodarr-proxy:latest-dev
          docker push ghcr.io/melodarr/melodarr-proxy:${{ steps.version.outputs.tag }}
          docker push ghcr.io/melodarr/melodarr-proxy:latest-dev

      - name: Build and push melodash image
        run: |
          docker build -t ghcr.io/melodarr/melodarr-proxy-melodash:${{ steps.version.outputs.tag }} ./melodash
          docker tag ghcr.io/melodarr/melodarr-proxy-melodash:${{ steps.version.outputs.tag }} ghcr.io/melodarr/melodarr-proxy-melodash:latest-dev
          docker push ghcr.io/melodarr/melodarr-proxy-melodash:${{ steps.version.outputs.tag }}
          docker push ghcr.io/melodarr/melodarr-proxy-melodash:latest-dev
