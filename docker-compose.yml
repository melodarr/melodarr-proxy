name: melodarr-proxy

services:
  proxy:
    build: 
      context: .
      target: production
    restart: unless-stopped

    environment:
      PORT: 3000
      REDIS_URL: redis://redis:6379
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      REQUIRE_API_KEY: ${REQUIRE_API_KEY:-true}
      SETTINGS_SESSION_SECRET: ${SETTINGS_SESSION_SECRET:-}
      DATA_DIR: /data
      MUSICBRAINZ_BASE_URL: ${MUSICBRAINZ_BASE_URL:-https://musicbrainz.org/ws/2}
      MUSICBRAINZ_IP_FAMILY: ${MUSICBRAINZ_IP_FAMILY:-auto}
      MUSICBRAINZ_MIN_REQUEST_INTERVAL_MS: 1100
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-86400}
      UPSTREAM_TIMEOUT_MS: ${UPSTREAM_TIMEOUT_MS:-8000}
      SERVER_TIMEOUT_MS: ${SERVER_TIMEOUT_MS:-15000}
      GLOBAL_RATE_LIMIT_MAX: ${GLOBAL_RATE_LIMIT_MAX:-500}
      MAX_CONCURRENT_REQUESTS: ${MAX_CONCURRENT_REQUESTS:-20}
      SLOW_REQUEST_MS: 2000
      JWT_SECRET: ${JWT_SECRET:-super-secret-key}
      METADATA_PROVIDERS: ${METADATA_PROVIDERS:-musicbrainz,itunes}
      PROVIDER_PRIORITY: ${PROVIDER_PRIORITY:-musicbrainz,theaudiodb,itunes,lastfm,discogs}
      THEAUDIODB_API_KEY: ${THEAUDIODB_API_KEY:-}
      LASTFM_API_KEY: ${LASTFM_API_KEY:-}
      DISCOGS_TOKEN: ${DISCOGS_TOKEN:-}
      ITUNES_COUNTRY: ${ITUNES_COUNTRY:-US}
    ports:
      - "${HOST_PORT:-0}:3000"
    volumes:
      - melodarr_proxy_data:/data
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3

  melodash:
    image: ${MELODASH_IMAGE:-ghcr.io/melodarr/melodarr-proxy-melodash:latest}
    build:
      context: ./melodash
    restart: unless-stopped
    environment:
      PORT: 3000
      PROXY_API_URL: http://proxy:3000/api
    ports:
      - "${MELODASH_HOST_PORT:-55026}:3000"
    depends_on:
      - proxy

  melodash-test:
    profiles: ["test"]
    build:
      context: ./melodash
      target: test

  test:
    profiles: ["test"]
    build:
      context: .
      target: test


volumes:
  melodarr_proxy_data:
